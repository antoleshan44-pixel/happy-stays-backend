# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=always
server.error.include-binding-errors=always

# Use profiles for database configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT Configuration
jwt.secret=my-super-secret-jwt-key-for-development
jwt.expiration=86400000

# File Upload Configuration - INCREASED FOR VIDEO (100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB

# Upload Directory (where files will be stored)
upload.dir=uploads

# Path Matching (to fix the pattern issue)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging - ENHANCED FOR DEBUGGING
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.com.eserian.homes=DEBUG
logging.level.org.hibernate.SQL=DEBUG