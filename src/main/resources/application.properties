# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/airbnb_clone?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=newpassword123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=my-super-secret-jwt-key-for-development
jwt.expiration=86400000

# File Upload Configuration - INCREASED FOR VIDEO (100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=C:/temp/uploads

# Upload Directory (where files will be stored)
upload.dir=uploads

# Path Matching (to fix the pattern issue)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging - ENHANCED FOR DEBUGGING
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.com.eserian.homes=DEBUG
logging.level.org.hibernate.SQL=DEBUG